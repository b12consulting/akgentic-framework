[project]
name = "akgentic-llm"
version = "1.2.1"
description = "LLM integration layer for Akgentic agent systems"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["llm", "agents", "ai", "pydantic-ai", "react"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic-ai>=1.107.0,<2",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
    # Test-only: tests/test_event_serialization.py imports akgentic.core.
    # akgentic-llm itself must not depend on core, so it stays out of
    # [project.dependencies].
    "akgentic-core>=1.3.3,<1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]
artifacts = ["src/akgentic/llm/pricing.yaml"]

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Pre-existing type errors — exempted to keep CI green. New files in these
# modules must pass strict mypy before the override is removed. Both are
# pydantic-ai surface drift: the Agent(...) overloads no longer list
# history_processors/instrument, and get_model returns object.
[[tool.mypy.overrides]]
module = [
    "akgentic.llm.agent",
    "akgentic.llm.providers",
]
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
