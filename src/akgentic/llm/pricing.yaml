# OpenAI — GPT-5 family
#
# Every flagship carries the siblings that contain its key as a substring: the matcher in
# _resolve_pricing scans keys longest-first, so a flagship listed without its cheaper
# siblings silently bills them at its own rate. Note that "gpt-5.1-mini" does NOT contain
# "gpt-5-mini" — the ".1" breaks the substring — so it needs its own row, as does
# "gpt-5.1-codex-mini", which is the same model under its other upstream id.
#
# cache_write equal to input is deliberate, not filler: the reference publishes no separate
# cache-write rate for these models because a cache write bills at the ordinary input rate.
# The three GPT-5.6 rows below carry a genuine 1.25x surcharge instead.
gpt-5:
  input: 1.25
  output: 10.0
  cache_read: 0.125
  cache_write: 1.25

