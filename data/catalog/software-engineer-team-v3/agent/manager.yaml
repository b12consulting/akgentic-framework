id: manager
kind: agent
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.core.AgentCard
description: Owns the delivery workflow, the stage gates and the story files, and holds
  none of the technical content.
payload:
  description: Owns the delivery workflow, the stage gates and the story files, and
    holds none of the technical content. Reads and writes the workspace including
    the story files it creates under stories/, keeps the plan and the knowledge graph, and can hire. Has NO shell
    — cannot run git, tests or any command. Runs the BMAD story workflow only when the work needs it; answers direct questions through a single task.
  agent_class: akgentic.agent.BaseAgent
  skills:
  - workflow
  - stage-gates
  - story-authoring
  - planning
  - knowledge-graph
  - workspace-read
  - workspace-write
  - hiring
  - no-shell
  - workflow:plan-the-backlog
  - workflow:create-a-story
  - workflow:write-the-report
  config:
    name: '@Manager'
    role: Manager
    prompt:
      __ref__: id_manager_prompt
    model_cfg:
      __ref__: id_gpt_56_terra_manager
    run_usage_limits:
      __ref__: id_run_limits_manager
    agent_usage_limits:
      __ref__: id_agent_limits_manager
    tools:
    - __ref__: id_workspace_manager
    - __ref__: id_planning
    - __ref__: id_knowledge_graph
    - __ref__: id_team_manager
    - __ref__: software-engineering-skills.id_skills_manager
