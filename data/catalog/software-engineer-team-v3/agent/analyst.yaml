id: analyst
kind: agent
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.core.AgentCard
description: Turns a request into scoped, testable acceptance criteria and names what
  is out of scope.
payload:
  description: Turns a request into scoped, testable acceptance criteria and names
    what is out of scope. Reads the codebase with glob and grep, edits its own sections of
    the story file (Story, Acceptance Criteria, and Findings in analysis stories), and can search the web. 
    Cannot edit source code and has NO shell. Answers directly, or runs a named workflow.
  agent_class: akgentic.agent.BaseAgent
  skills:
  - requirements
  - scoping
  - acceptance-criteria
  - workspace-read
  - glob
  - grep
  - web-search
  - edits-story-sections
  - no-source-edit
  - no-shell
  - workflow:write-acceptance-criteria
  - workflow:write-findings
  config:
    name: '@Analyst'
    role: Analyst
    prompt:
      __ref__: id_analyst_prompt
    model_cfg:
      __ref__: global.id_gpt_56_luna
    run_usage_limits:
      __ref__: id_run_limits_specialist
    agent_usage_limits:
      __ref__: id_agent_limits_specialist
    tools:
    - __ref__: id_workspace_analysis
    - __ref__: id_search_analyst
    - __ref__: id_knowledge_graph_ro
    - __ref__: id_team_specialist
    - __ref__: id_planning_member
    - __ref__: software-engineering-skills.id_skills_analyst
