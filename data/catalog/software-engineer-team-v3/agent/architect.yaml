description: Chooses the approach, states the alternative it rejected and why, and
  names the components and files the change lands in.
payload:
  description: Chooses the approach, states the alternative it rejected and why, and
    names the components and files the change lands in. Reads the codebase with glob
    and grep, edits the story file's Dev Notes, and can search the web. Cannot edit source
    code and has NO shell. Answers directly, or runs a named workflow.
  agent_class: akgentic.agent.BaseAgent
  skills:
