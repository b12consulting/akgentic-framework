  - technical-design
  - trade-off-analysis
  - workspace-read
  - glob
  - grep
  - web-search
  - edits-story-sections
  - no-source-edit
  - no-shell
  - workflow:write-dev-notes
  - workflow:write-findings
  config:
    name: '@Architect'
    role: Architect
    prompt:
      __ref__: id_architect_prompt
    model_cfg:
      __ref__: global.id_gpt_6_luna
    run_usage_limits:
      __ref__: id_run_limits_specialist
    agent_usage_limits:
      __ref__: id_agent_limits_specialist
    tools:
    - __ref__: id_workspace_analysis
    - __ref__: id_search_architect
    - __ref__: id_knowledge_graph_ro
    - __ref__: id_team_specialist
    - __ref__: id_planning_member
    - __ref__: software-engineering-skills.id_skills_architect
