id: id_planning
kind: tool
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.tool.planning.PlanningTool
description: The manager's stage board and gather ledger. search_planning is off - the whole
  board is in the manager's system prompt every turn, and a measured run spent 6 requests
  searching what it already had.
payload:
  search_planning: false
  update_planning:
    instructions: |
      One task per task you dispatch, owned by the agent you sent it to, described by the
      story or the question.

      A specialist that sends a `notification` is NOT done - leave its task open. Only a
      `response` closes a task.

      The board is always in your context, refreshed every turn - never spend a call to look
      at it. Before sending anything to @Human, check it there: if any task is open, you are
      waiting - send nothing and stop.
