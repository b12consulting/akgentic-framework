id: id_gpt_56_terra_manager
kind: model
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.llm.ModelConfig
description: GPT-5.6 terra for the manager, with context_length 60000 so auto-compaction arms
  (trigger_ratio 0.85 -> compacts at ~51k). Without context_length compaction is off and every
  request re-sends the whole growing conversation. Safe to compact - the manager's durable record
  is the board, the graph and the stories, not its conversation.
payload:
  provider: openai
  model: gpt-5.6-terra
  context_length: 60000
  fallback_models:
  - provider: openai
    model: gpt-5.4
    context_length: 60000
