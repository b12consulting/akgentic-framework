  id_knowledge_graph:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: The delivery record — read/write for the manager
    payload:
      update_graph:
        instructions: |
          This graph is the record of the work, and the user watches it while you work. A node
          whose description repeats its own name is worthless - put the substance in.

          Work at 20-30 nodes. Do NOT prune early. Past ~30, prefer merging two thin nodes into
          one substantive node over deleting a real finding, and copy anything you do remove
          into the story's Notes first.

          Every node needs a 2-3 sentence description and observations prefixed:
            "Reported by @X: ..."   what that specialist established (ALWAYS present)
            "Confirmed by @X: ..."  a peer checked it and it held
            "Contested by @X: ..."  a peer disagreed, unresolved - record it, never drop it
            "Revised: ..."          what changed after a consultation and why
            "Evidence: ..."         a file:line, a test result, a benchmark
            "Open: ..."             what is unknown, and who would settle it

          After every peer consultation between two specialists, record its outcome. That
          exchange is the most valuable thing the team produces; losing it wastes the
          consultation. Grow nodes with update_entities + add_observations rather than
          replacing them.

  id_knowledge_graph_ro:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: The delivery record — read-only for specialists
    payload:
      read_only: true
      get_graph:
        instructions: |
          This is the record of the work so far, and the observations say who established what.

          Read them before you answer. A "Confirmed by" line means a peer already checked that
          point - do not re-litigate it. A "Contested by" or "Open" line is exactly where your
          contribution is worth most.

          Reuse the names recorded here rather than inventing new ones for the same component,
          and never silently contradict the graph: if you disagree with something recorded, say
          so in your reply so it is captured as a Contested observation.

  id_planning:
    kind: tool
    model_type: akgentic.tool.planning.PlanningTool
    description: The manager's stage board and gather ledger. search_planning is off
      - the whole board is in the manager's system prompt every turn, and a measured
      run spent 6 requests searching what it already had.
    payload:
      search_planning: false
      update_planning:
        instructions: |
          One task per task you dispatch, owned by the agent you sent it to, described by the
          story or the question.

          A specialist that sends a `notification` is NOT done - leave its task open. Only a
          `response` closes a task.

          The board is always in your context, refreshed every turn - never spend a call to look
          at it. Before sending anything to @Human, check it there: if any task is open, you are
          waiting - send nothing and stop.

  id_planning_member:
    kind: tool
    model_type: akgentic.tool.planning.PlanningTool
    description: The team backlog, read-only — a specialist sees the tasks assigned
      to it.
    payload:
      update_planning: false
      get_planning:
        filter_by_agent: true
        instructions: |-
          The tasks shown here are yours. They are the backlog @Manager wrote, and they are the
          authority on what you are being asked for - your dispatch message carries the workflow, the
          board carries the commitment.

          You cannot change the board. If a task is wrong, mis-scoped or blocked, say so in your reply
          and @Manager will change it.
      get_planning_task:
        instructions: |-
          Look up a task by id when your dispatch references one you cannot see - usually a dependency
          someone else owns, whose result yours builds on.
      search_planning:
        instructions: |-
          Use this to find what the rest of the team is doing on this piece of work before you
          duplicate it, or to find the task whose output you depend on.

  id_search_analyst:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — domain and product context for the analyst
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds.

          Search only when the request turns on a domain fact, standard or regulation you do
          not know. You are not researching how to build it - that is @Architect's question.
          The codebase, not the web, is where most of your answers are.

  id_search_architect:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — libraries, patterns and known pitfalls for the architect
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds.

          Search only for an unfamiliar library, protocol or a known pitfall in one. Prefer
          official documentation and issue trackers over blog posts. What this codebase already
          does is a better guide than anything you will find on the web - read it first.

  id_team_manager:
    kind: tool
    model_type: akgentic.tool.team.TeamTool
    description: Team management for the manager — hire/fire, roster, profiles, activity
    payload: {}

  id_team_specialist:
    kind: tool
    model_type: akgentic.tool.team.TeamTool
    description: Team awareness for a specialist — roster and role profiles, so everyone
      knows who holds which tools. No hiring, no firing, no activity polling.
    payload:
      hire_team_members: false
      fire_team_members: false
      get_team_activity: false
      get_role_profiles: true
      get_team_roster: true

  id_workspace_analysis:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Codebase reading plus editing your own sections of the shared story
      file. Read anything; create nothing; edit only your sections of stories/<n>-<slug>.md.
    payload:
      workspace_delete: false
      workspace_write: false
      workspace_patch: false
      workspace_multi_edit: false
      workspace_view: false
      workspace_edit:
        instructions: |-
          You change ONE file: the story your dispatch names, stories/<n>-<slug>.md - and only the
          sections your role owns. Each section heading in the story says who owns it.

          Anchor every edit on your section heading or on the placeholder comment under it. Put your
          full reasoning there - the story is where depth belongs: your reply to @Manager is a
          summary and the path.

          The story is shared: teammates edit other sections while you work. If an edit is refused
          because the file changed since you read it, read it again and redo the edit - nothing of
          yours or theirs is lost. Add one line to the Change Log for each edit.

          Never edit source code, backlog.md or report.md.
      workspace_grep:
        instructions: |-
          Grep is how you find what already exists. Before asserting something is absent, search for
          it. When reviewing, grep for the CALLERS of anything that changed: most real bugs are at
          the boundary, not inside the diff.
      workspace_read:
        instructions: |-
          Read a file before making a claim about it, and cite file:line when you do. Read the story
          in full before you edit it.

          If the code you are asked about does not exist yet, two or three probes are enough to
          establish that. Say so and reason from the request instead of hunting further.

  id_workspace_dev:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Full read/write workspace for the developer and QA — source code,
      tests, and their own sections of the story file — with sandboxed command execution
    payload:
      workspace_view: false
      workspace_edit:
        instructions: |
          Read the whole file before you edit it, and match the conventions you find there -
          naming, error handling, test layout - rather than the ones you prefer.

          One task at a time. Do not batch unrelated changes into a single edit: a reviewer
          reading the File List has to be able to tell which change served which acceptance
          criterion.

          The story file stories/<n>-<slug>.md is shared - change only your own sections, always
          with workspace_edit anchored on the section heading. @Developer: tick the task
          checkboxes, fill the Dev Agent Record, set Status. @QA: fill QA Results. If an edit is
          refused because the file changed since you read it, read it again and redo the edit.
      workspace_write:
        instructions: |
          Prefer editing an existing file over writing a new one. Every file you add or change
          must appear in your File List - a file changed and not listed is a file the reviewer
          will not read.

          Never workspace_write a story file: it would replace every other role's sections.
      workspace_exec:
        instructions: |
          This is for running the project's own tests and checks - pytest, ruff, mypy, npm
          test, whatever this repository actually uses. Find the real command before inventing
          one; a test suite invoked the wrong way proves nothing.

          Report the REAL output, including failures. Never describe a run you did not perform.
          If the command cannot run here, say so plainly rather than implying it passed.

  id_workspace_manager:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: The manager's workspace — creates the story files from the seeded
      template, owns backlog.md and report.md, reads the codebase
    payload:
      workspace_delete: false
      workspace_patch: false
      workspace_multi_edit: false
      workspace_view: false
      workspace_write:
        instructions: |
          Use this for exactly three things: creating a NEW story file, backlog.md and report.md.

          A story starts as a copy of stories/_template.md: read the template, fill the number,
          title and Type, drop the sections its Type does not use, and write it to
          stories/<n>-<slug>.md. From then on the story is shared - every stage writes its own
          section into it - so you NEVER workspace_write an existing story. Change it with
          workspace_edit.

          Build report.md by reading the story files, not from memory.
      workspace_edit:
        instructions: |
          Your parts of a story: the Status line (drafted -> ready-for-dev), Tasks, and Notes.
          Anchor each edit on the section heading. Never change another role's section - if one is
          wrong, send it back to its owner.

          Teammates edit other sections of the same story while you work. If an edit is refused
          because the file changed since you read it, read it again and redo the edit.

          Before you remove anything from the knowledge graph, copy it into the story's Notes
          first. The graph is curated and loses things by design; the story is what makes that safe.
      workspace_read:
        instructions: |
          Read the story before dispatching a task - it is what the specialist will be working
          from, and if it is thin their answer will be too. A task whose section is still empty
          has NOT closed, and what depends on it must not start.
      resources:
      - file_name: stories/_template.md
        content: |
          # Story {n} — {title}

          **Status:** drafted · **Type:** {implementation or analysis}

          <!-- Status: drafted, ready-for-dev, in-progress, review, done.
               Every heading names its owner: edit only your own sections, with workspace_edit
               anchored on the heading, and add a line to the Change Log.
               An analysis story drops Dev Notes, Dev Agent Record and QA Results;
               an implementation story drops Findings.
               Never write a bare angle-bracket word: the viewer reads it as HTML. -->

          ## Story — @Analyst

          As a {who}, I want {what}, so that {why}.

          _For an analysis story: the question to answer, and who needs the answer._

          ## Acceptance Criteria — @Analyst

          - **AC1** — {checkable by someone else, without asking}

          **Out of scope:** {what this story deliberately does not do}

          ## Dev Notes — @Architect

          _Approach, the alternative rejected and why, files affected, risks, how to test — with
          file:line references into the existing code._

          ## Tasks — @Manager

          - [ ] **T1** @{Owner} — {task} (AC 1)

          _Each owner ticks its own task. Review follow-ups are added by @Reviewer as **R1.1**, **R1.2**…_

          ## Findings — task owners

          _One subsection per task — `### T1 · @Owner — task` — with the answer first, then the
          evidence: file:line, command and output._

          ## Dev Agent Record — @Developer

          - **Files changed:** {every file added, changed or deleted}
          - **Test runs:** {exact command and real result}
          - **Deviations from Dev Notes:** {or "none"}

          ## QA Results — @QA

          _Tests added and the AC each proves, the run, what is not covered._

          ## Review — @Reviewer

          _One `### Round N — APPROVE / CHANGES REQUESTED / REJECT` per review, appended._

          ## Notes — anyone

          _Decisions, disagreements and open questions — one line each, signed._

          ## Change Log — anyone

          - @{who} — {what changed}

  id_workspace_read:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Read-only codebase access with glob and grep — for analyst, architect
      and reviewer
    payload:
      read_only: true
      workspace_view: false
      workspace_grep:
        instructions: |
          Grep is how you find what already exists. Before asserting that something is absent,
          search for it - a request that looks new is often already half-implemented under a
          different name. When reviewing, grep for the CALLERS of anything that changed: most
          real bugs are at the boundary, not inside the diff.
      workspace_read:
        instructions: |
          Read a file before making a claim about it. Cite file:line when you do - a statement
          someone else can check is worth several they cannot.

  id_workspace_review:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: The reviewer's workspace — codebase reading, editing the review sections
      of the shared story file, and sandboxed execution to verify tests. Never edits
      code.
    payload:
      workspace_delete: false
      workspace_write: false
      workspace_patch: false
      workspace_multi_edit: false
      workspace_view: false
      workspace_edit:
        instructions: |-
          You change ONE file: the story your dispatch names, stories/<n>-<slug>.md. Your parts:
          - Review - append one "### Round N - <verdict>" per review; never rewrite an earlier
            round.
          - Follow-up tasks under Tasks, when you request changes: one
            "- [ ] **R{round}.{k}** @Developer — [High|Med|Low] {the fix} — file:line" per finding.
          - Status: done on APPROVE, in-progress on CHANGES REQUESTED or REJECT.

          Never change the ACs, the Dev Notes, the task wording or the Dev Agent Record - if one is
          wrong, that is a finding. Never edit source code or tests: fixing what you review destroys
          the independence that makes the review worth anything.

          The story is shared: if an edit is refused because the file changed since you read it,
          read it again and redo the edit. Add one line to the Change Log for each edit.
      workspace_grep:
        instructions: |-
          Grep is how you find what already exists. Before asserting something is absent, search for
          it. Grep for the CALLERS of anything that changed: most real bugs are at the boundary, not
          inside the diff.
      workspace_read:
        instructions: |-
          Read a file before making a claim about it, and cite file:line when you do. Read the story
          in full first - the ACs, the Dev Notes and the File List are what you review against.
      workspace_exec:
        instructions: |-
          Use this to RUN the tests the developer says pass, and the project's own lint and type checks.
          A review that takes a test result on trust is an inspection, not a review.

          Run; do not fix. If something fails that is a finding for your verdict - report the real
          output. Never edit code to make a test pass: that is @Developer's job, and doing it yourself
          destroys the independence that makes your review worth anything.

  #### ─── Models ───────────────────────────────────────────────────────── ####
  graph_schemas:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: Knowledge graph schema for the software delivery record
    payload:
      value: |
        === START SCHEMA =====================================================

        This graph is the RECORD OF THE WORK. Work at 20-30 nodes. Every node carries a
        substantive `description` (2-3 sentences, never a restatement of the name) and
        `observations` that hold the discussion.

        ## Observation vocabulary — use these prefixes

        "Reported by @X: ..."    what that specialist established. ALWAYS present.
        "Confirmed by @X: ..."   a peer checked it and it held (the output of a consultation)
        "Contested by @X: ..."   a peer disagreed, unresolved — record it, never drop it
        "Revised: ..."           what changed after a consultation, and why
        "Evidence: ..."          something grounded: a file:line, a test result, a benchmark
        "Open: ..."              what is still unknown, and who would settle it

        ## Core Entities

        (:WorkItem) - A unit of delivery, matching a story file in stories/.
        - name, description (what is being changed and why)
        - Observations: "Status: drafted|ready-for-dev|in-progress|review|done|blocked" - the story's own Status line

        (:Requirement) - An acceptance criterion. One node per AC worth tracking.
        - name (e.g. "AC2 reject negative quantity"), description (the criterion, testably stated)
        - Observations: "Met"|"NotMet"|"NotVerifiable", + vocabulary above

        (:Component) - A part of the system the change touches.
        - name (the real module/package name), description (what it does, and how it is affected)
        - Observations: "Changed"|"Unchanged"|"New", + vocabulary above

        (:Decision) - A design choice that was actually decided, with its alternative.
        - name, description (what was chosen, what was rejected, and why)
        - Observations: "Rejected: <the alternative>", + vocabulary above

        (:Risk) - Something that could go wrong, and what would make it real.
        - name, description
        - Observations: "Trigger: <what would make it real>", "Mitigation: <...>"

        (:TestResult) - Evidence that something works or does not.
        - name (the command or the test), description (what it proves)
        - Observations: "Passed"|"Failed"|"NotRun", "Evidence: <output>"

        ## Relationships — give each a one-line description of what the link means

        (:WorkItem)-[:REQUIRES]->(:Requirement)
        (:WorkItem)-[:TOUCHES]->(:Component)
        (:WorkItem)-[:DECIDED]->(:Decision)
        (:Decision)-[:AFFECTS]->(:Component)
        (:Decision)-[:CARRIES]->(:Risk)
        (:Requirement)-[:VERIFIED_BY]->(:TestResult)
        (:Component)-[:DEPENDS_ON]->(:Component)

        === END SCHEMA ========================================================

  id_agent_limits_manager:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: Lifetime budget for the manager. An agent-tier breach is terminal,
      so this is set well clear of a long session.
    payload:
      agent_request_limit: 60
      total_tokens_limit: 1000000

  id_agent_limits_specialist:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: Lifetime budget for a specialist, bounding a whole session even when
      every individual run stays under its own cap.
    payload:
      agent_request_limit: 40
      total_tokens_limit: 1000000

  id_gpt_61_sol_manager:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-6.1 sol for the manager, with context_length 60000 so auto-compaction
      arms (trigger_ratio 0.85 -> compacts at ~51k). Without context_length compaction
      is off and every request re-sends the whole growing conversation. Safe to compact
      - the manager's durable record is the board, the graph and the stories, not
      its conversation.
    payload:
      provider: openai
      model: gpt-6.1-sol
      context_length: 60000
      fallback_models:
      - provider: openai
        model: gpt-5.6-terra
        context_length: 60000

  id_run_limits_manager:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: Per-run brake for the manager. tool_calls_limit is 20 because it
      writes the story, the graph and the plan on every stage close - a measured session
      used 26 across runs.
    payload:
      run_request_limit: 15
      tool_calls_limit: 20
      total_tokens_limit: 200000
      output_tokens_limit: 6000

  id_run_limits_specialist:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: Per-run brake for a specialist. tool_calls_limit is 30 because reading
      a codebase is genuinely tool-heavy - a measured analyst turn used 21 and a reviewer
      12. output_tokens_limit is a runaway guard, NOT a length enforcer.
    payload:
      run_request_limit: 20
      tool_calls_limit: 30
      total_tokens_limit: 200000
      output_tokens_limit: 4000

