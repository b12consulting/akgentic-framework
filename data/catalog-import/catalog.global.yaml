namespace: global
user_id: anonymous
name: Global Library
description: Shared model configs and tool definitions referenced cross-namespace
  via global.id_xxx
properties: {}
shareable: true
public: true
entries:

  #### ─── Tools ────────────────────────────────────────────────────────── ####
  id_knowledge_graph:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — full read/write access for the manager
    payload: {}

  id_knowledge_graph_ro:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — read-only access for team members
    payload:
      read_only: true

  id_metadata:
    kind: tool
    model_type: akgentic.tool.metadata.MetadataTool
    description: Team metadata — renders the team's business context into every agent's
      frozen system prompt, once, from one operator-written template
    payload:
      render_metadata:
        header: Team context
        template: |-
          Tenant: {tenant}
          Case reference: {case_ref}
          Service tier: {tier}
          Note: {note}
        expose:
        - command
        - system_prompt

  id_notification:
    kind: tool
    model_type: akgentic.tool.notification.NotificationTool
    description: Notification tool — schedule a delayed message to yourself
    payload:
      message_class: akgentic.agent.messages.AgentMessage
      max_delay_seconds: 300

  id_planning:
    kind: tool
    model_type: akgentic.tool.planning.PlanningTool
    description: Planning tool to manage team plans and tasks
    payload:
      vector_store: false
      update_planning:
        instructions: |
          Use the planning tool for:
          - Create tasks for multi-step work that benefits from explicit tracking.
          - Update task status as work progresses.
          - Record outputs when tasks are completed.
          - Ensure the plan stays accurate when a tracked task exists.

  id_shared_workspace:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Shared workspace tool for managing agent interactions and data
    payload:
      workspace_id: shared_workspace

  id_skills_deliverables:
    kind: tool
    model_type: akgentic.tool.skill.SkillTool
    description: Skill library — producing written deliverables (reports, reviews,
      source summaries)
    payload:
      param:
        skills:
        - name: write-report
          description: How to structure a report so the reader gets the answer before
            the method.
          content: |
            A report is read by someone deciding whether to act. Structure it for that reader, not
            for the order in which you did the work.

            **Lead with the answer.** The first paragraph states what you found and what it means.
            A reader who stops there should still have the conclusion. Building to a conclusion in
            the final paragraph is the single most common structural error, and it costs the reader
            the whole document to recover one sentence.

            **Then the support, strongest first.** Each section makes one claim and gives the
            evidence for it. If a section does not change what the reader should do, cut it —
            including work you are proud of.

            **Separate what you know from what you infer.** Mark inference as inference. A reader who
            cannot tell measurement from estimate will either trust both or neither, and both are
            wrong.

            **State the limits explicitly.** What you did not check, what data was missing, where the
            result would change. A report with no stated limits reads as either naive or evasive, and
            the reader will assume whichever is worse.

            On length: cut every sentence that describes the process rather than the finding.
            "We analysed the data and found that X" is "X". Numbers belong in tables, not in prose —
            a sentence with four figures in it is unreadable, and the same four in a table are
            scannable.

            Finish by re-reading only the opening paragraph. If it does not survive on its own, the
            report is not done.
        - name: review-document
          description: How to review someone else's document so the feedback is actionable
            rather than a list of reactions.
          content: |
            Review in two passes. Mixing them produces a list of typos that misses a wrong argument.

            **First pass — is it right?** Read for the claim and the evidence. Ignore wording
            entirely. Ask: does the conclusion follow? Is anything asserted that is not supported? Is
            there a claim that would change the reader's decision if it were wrong, and is that claim
            adequately supported? Is anything important missing — an alternative not considered, a
            risk not named, a limit not stated?

            **Second pass — is it clear?** Only once the substance holds. Structure, order,
            redundancy, wording. There is no point polishing a paragraph that should be deleted.

            **Write findings so they can be acted on.** Each one names the location, states the
            problem, and says what would resolve it. "This section is confusing" is not actionable;
            "this section states the conclusion before defining the term it depends on — define it
            first, or move the definition up" is.

            **Separate severity honestly.** Distinguish what is wrong, what is unclear, and what you
            would have done differently. The third category is preference, and should be labelled as
            preference — mixing it with the first two makes a reviewer's whole list easy to dismiss.

            **Say what works, briefly and specifically.** Not to soften the review, but because the
            author needs to know what not to change while fixing everything else.

            If you find nothing substantive, say so plainly. Manufacturing findings to look thorough
            wastes the author's time and devalues your real findings on the next review.
        - name: summarize-source
          description: How to compress a long source without losing what makes it
            usable later.
          content: |
            A summary is written for a reader who will not open the source. What survives compression
            determines whether it is useful or merely short.

            **Keep, always:**

            - The claims, with their strength preserved. If the source says "may indicate", do not
              write "shows". Silently upgrading hedged claims into confident ones is the most common
              and most damaging summarisation error.
            - Numbers, with their units and their basis. A figure without its denominator is noise.
            - Definitions the source relies on, especially where it uses a common word in a narrow
              way.
            - Anything that contradicts the source's own conclusion. It is the first thing a careless
              summary drops and the first thing a careful reader wants.

            **Drop:** worked examples, restatements, throat-clearing, and the source's own summary of
            itself — which is usually written to persuade rather than to inform.

            **Preserve structure where structure carries meaning.** If the source argues in steps, a
            summary that reorders them into topics loses the argument. If it is a list of independent
            findings, the order is free.

            **Record what you dropped, in one line.** "Omits the methodology section and three worked
            examples." A reader who knows what is missing can decide whether to open the source; one
            who does not will assume the summary is complete.

            Never resolve an ambiguity on the author's behalf. If the source is unclear on a point
            that matters, say that it is unclear — that fact is part of what you were asked to report.

  id_skills_teamwork:
    kind: tool
    model_type: akgentic.tool.skill.SkillTool
    description: Skill library — working inside a multi-agent team (delegation, handover,
      escalation)
    payload:
      param:
        skills:
        - name: delegate-work
          description: How to hand a task to a teammate so they can act on it without
            asking you three questions first.
          content: |
            Delegating well is mostly about removing the need for a follow-up round trip.

            Before you send anything, decide whether you should delegate at all. Delegate when the
            work needs a capability you do not have, or when it can proceed in parallel with what you
            are doing. Do not delegate work you could finish in the time it takes to describe it, and
            do not delegate a task you cannot judge the result of — you will not be able to tell a
            good answer from a confident wrong one.

            A delegated task carries four things:

            1. **The goal, not the steps.** Say what "done" looks like. A teammate who knows the goal
               can recover when the steps turn out to be wrong; one who only has steps cannot.
            2. **The inputs.** Name the files, the identifiers, the prior decisions. If you are
               holding context they do not have, include it — they cannot see your conversation.
            3. **The boundary.** What is explicitly out of scope, and what they must not change.
               This is the single most common omission, and the one that produces work you have to
               throw away.
            4. **The form of the answer.** A number, a file, a recommendation with a rationale, a
               yes/no. Say which.

            Send one task per message. Two tasks in one message reliably produce one answer.

            When the result comes back, check it against the goal you stated rather than against what
            you would have done. If it is wrong, say what is wrong and what "right" would look like —
            "please redo this" without a diagnosis produces a different wrong answer.
        - name: hand-over
          description: What a handover must contain when you stop working on something
            and someone else picks it up.
          content: |
            A handover fails when the person picking up has to reconstruct what you already knew. It
            is not a summary of what you did; it is what they need to continue.

            Write these five, in this order:

            1. **State.** What is true right now. Not the history — the current position. "The
               migration script runs and processes 40 000 of 52 000 rows before failing."
            2. **The immediate next action.** The one thing you would do if you had another ten
               minutes. Be specific enough that they can start without deciding anything.
            3. **What you ruled out, and why.** This is the part that saves the most time and is
               skipped the most often. Someone who does not know what you eliminated will eliminate
               it again.
            4. **Open questions.** Things you could not resolve, and who or what could resolve them.
               Mark any question that blocks progress as blocking.
            5. **Traps.** Anything that looks wrong but is deliberate, and anything that looks fine
               but is not. If you leave one thing behind, leave this.

            Two rules about tone. Do not describe your own effort — how long something took does not
            help the next person. And do not soften a dead end: "this approach does not work, here is
            the evidence" is more useful than "this approach may need more investigation".
        - name: escalate-to-human
          description: When to stop and ask a person, and what the escalation message
            must contain.
          content: |
            Escalate when continuing would mean guessing at something only a person can decide. That
            is a narrow set, and it is worth being precise about, because escalating too often is as
            costly as never escalating — a team that raises everything trains its humans to skim.

            **Escalate when:**

            - The action is hard to reverse and you were not clearly asked for it — deleting data,
              sending something outside the organisation, spending money.
            - Two instructions genuinely conflict and no reading satisfies both.
            - You have found something that changes the premise of the task — the request assumes
              something that is not true.
            - You are blocked on access, permission, or a credential.

            **Do not escalate** to confirm a judgment you are equipped to make, to report progress,
            or because a task is merely difficult. Make the call, state the assumption you made, and
            continue.

            **An escalation message contains, in this order:**

            1. **The decision needed**, phrased as a question with the options you see. Not "what
               should I do?" — "should I X or Y? I recommend X because …".
            2. **What is blocked** by not answering, and what is not. If most of the work can
               continue, say so; the person can then answer at their own pace.
            3. **The evidence** — enough for them to check your reasoning, and no more.
            4. **What you have already tried**, so they do not suggest it.

            While you wait, finish everything that does not depend on the answer. Arriving with the
            question *and* the rest of the work done is the difference between an escalation that
            helps and one that stalls a team.
        - name: resolve-disagreement
          description: What to do when a teammate's answer contradicts yours or your
            own evidence.
          content: |
            A contradiction between two agents is information, not an obstacle. The wrong responses
            are to defer automatically to the other agent, and to restate your position louder.

            Work through it in this order:

            1. **Check that you disagree about the same thing.** Most apparent conflicts are two
               correct answers to two different questions — different time ranges, different
               definitions, different scopes. State the question precisely and see whether the
               disagreement survives.
            2. **Compare evidence, not conclusions.** Ask what the other answer is based on. If one
               side has a source and the other has an inference, the source wins. If both have
               sources that disagree, the disagreement is real and worth surfacing.
            3. **Try to falsify your own answer first.** It is the cheaper test, because you know
               where your own reasoning is thin.
            4. **If it does not resolve, escalate the disagreement itself** — not your side of it.
               Present both positions and the evidence for each, and say which you find more likely
               and why. A human resolving a fairly-presented conflict is fast; one refereeing two
               advocates is slow.

            Do not split the difference. An average of two incompatible answers is usually wrong in a
            way that neither original answer was, and it hides the fact that a question is still open.

  id_web_search:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search + crawl + fetch over Tavily
    payload:
      web_search:
        max_results: 5
      web_crawl:
        timeout: 150.0
        max_depth: 3
        max_breadth: 5
        limit: 10
      web_fetch:
        timeout: 30.0

  id_workspace:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Workspace tool for managing agent interactions and data
    payload: {}

  #### ─── Models ───────────────────────────────────────────────────────── ####
  id_agent_usage_limits_small:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: 'Small agent-lifetime budget: 3 runs across the agent''s whole life,
      50k tokens'
    payload:
      agent_request_limit: 3
      total_tokens_limit: 50000

  id_compaction_config:
    kind: model
    model_type: akgentic.llm.CompactionConfig
    description: |
      Pluggable LLM context-compaction configuration (all defaults).
      Compaction shrinks an agent's running context when it grows large, emitting an
      LlmContextCompactedEvent. The auto-trigger only arms when the agent's ModelConfig sets
      context_length (the token budget); leave context_length null to keep compaction off.
      strategy is a registry id ('summarize' = LLM summary, 'sliding_window' = deterministic drop,
      'none' = no-op) or a dotted FQCN resolved via COMPACTION_STRATEGIES. summarizer_prompt_version
      selects the summarizer instructions from the SUMMARY_INSTRUCTIONS registry and is recorded on
      the emitted event. Two constraints when auto_trigger is true: it is mutually exclusive with a
      sliding window (ReactAgentConfig.max_messages), and trigger_ratio * context_length must stay
      strictly below any input/total token usage limit so the trigger fires before the limit bites.
    payload:
      strategy: summarize
      auto_trigger: true
      trigger_ratio: 0.85
      keep_recent_messages: 4
      summary_target_tokens: 2000
      summarizer_prompt_version: v1
      summary_model_cfg: null

  id_gpt_41:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-4.1 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-4.1
      temperature: 0.3

  id_gpt_52:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.2 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-5.2

  id_gpt_54:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.4 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-5.4

  id_gpt_56_luna:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.6 luna (small/fast tier) with fallback to gpt-5.4-mini - member
      model
    payload:
      provider: openai
      model: gpt-5.6-luna
      fallback_models:
      - provider: openai
        model: gpt-5.4-mini

  id_gpt_56_sol:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.6 sol (flagship) - not wired in by default, swap a model_cfg
      ref to use
    payload:
      provider: openai
      model: gpt-5.6-sol
      fallback_models:
      - provider: openai
        model: gpt-5.4

  id_gpt_56_terra:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.6 terra (mid tier) with fallback to gpt-5.4 - coordinator model
    payload:
      provider: openai
      model: gpt-5.6-terra
      fallback_models:
      - provider: openai
        model: gpt-5.4

  id_model_config:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: |
      LLM model configuration — provider/model/temperature/etc. (all defaults).
      Provider auth is supplied via environment variables, never here: OPENAI_API_KEY (openai),
      AZURE_OPENAI_API_KEY + AZURE_OPENAI_ENDPOINT (azure), ANTHROPIC_API_KEY (anthropic),
      GOOGLE_API_KEY (google-gla), MISTRAL_API_KEY (mistral), NVIDIA_API_KEY (nvidia). Leave a field
      null to use the provider default. temperature/seed give reproducibility control; reasoning_effort
      ('low' | 'medium' | 'high') applies only to o1/o3-style reasoning models.
    payload:
      provider: openai
      model: gpt-5.2
      temperature: null
      seed: null
      max_tokens: null
      reasoning_effort: null

  id_model_roster_agent_team:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: |
      Switchable model roster for Agent Team V1 — declared ONCE here and shared by @Manager,
      @Assistant and @Expert, instead of the same three-ref list repeated on every agent.
      Contents: gpt-5.4 (strongest), gpt-5.2, gpt-4.1 (cheapest, temperature 0.3). Order is
      listing order only — it does not pick the active model.
      HOW IT WORKS: a whole LIST is made ref-addressable by wrapping it in a NativeValue, the
      catalog's sanctioned value carrier. The resolver populates THIS payload first, in THIS
      namespace, so each element becomes a real ModelConfig; it then unwraps the NativeValue and
      splices the bare list into the consuming AgentConfig.model_roster. That is why the inner
      refs are written bare (id_gpt_54), not global-prefixed.
      EACH AGENT STILL DECLARES ITS OWN model_cfg. The roster is the set an agent may switch
      between; model_cfg is the one in force, and it must be one of the three below or
      ReactAgentConfig refuses the config outright.
      Adding a model here arms it for every agent of the team at once — that is the point, and
      it is also the risk: there is no per-agent subsetting once the roster is shared.
    payload:
      value:
      - __ref__: id_gpt_54
      - __ref__: id_gpt_52
      - __ref__: id_gpt_41

  id_run_usage_limits_small:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: 'Small per-run budget: 2 model requests per run, 20k tokens'
    payload:
      run_request_limit: 2
      total_tokens_limit: 20000

  id_runtime_config:
    kind: model
    model_type: akgentic.llm.RuntimeConfig
    description: "ReAct runtime tuning — retries, end strategy, parallel tool calls,\
      \ http client (all defaults).\nhttp_client_config controls resilience of the\
      \ underlying LLM HTTP calls: it retries on transient\nfailures (HTTP 429 rate\
      \ limit, 503 service unavailable, connection errors) using exponential backoff.\
      \ \nBackoff delay per attempt = min(backoff_max, backoff_multiplier * (2 **\
      \ attempt)).\nTune timeout for slow models, max_retries for how persistent to\
      \ be, backoff_multiplier to set\nhow fast delays grow, and backoff_max to cap\
      \ the longest wait between retries.\n"
    payload:
      retries: 3
      end_strategy: exhaustive
      parallel_tool_calls: true
      http_client_config:
        timeout: 120.0
        max_retries: 5
        backoff_multiplier: 0.5
        backoff_max: 60.0

  id_usage_limits:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: |
      Token/request budgets to control costs for each react agent run (all defaults).
      Limits are enforced cumulatively across all requests within a single agent run; exceeding any
      of them raises UsageLimitError and stops the run. Every limit is optional — set it to null to
      mean "unlimited" — except run_request_limit, which defaults to 50 as a safety stop against
      runaway ReAct loops. Set the *_tokens_limit fields to cap spend per run; set tool_calls_limit
      to bound how many tools an agent may invoke.
    payload:
      run_request_limit: 50
      tool_calls_limit: null
      input_tokens_limit: null
      output_tokens_limit: null
      total_tokens_limit: null
